server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # arquivos com hash no nome (gerados pelo Vite): cache longo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # gerado no boot do container: nunca em cache, senão uma troca de ambiente demora a valer
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # SPA: qualquer rota cai no index.html, que nunca fica em cache (sempre aponta para os assets novos)
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri /index.html;
    }
}
