# Desenvolvimento: carregado automaticamente pelo `docker compose`
services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  rabbitmq:
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  keycloak:
    # dev: sem build otimizado, tema montado do host e sem cache (edite o CSS e recarregue a página)
    command: ["start-dev", "--import-realm"]
    # start-dev refaz o build no boot: as opções de build (fixas no Dockerfile) vão de novo aqui
    environment:
      KC_DB: postgres
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak/themes/gabarit:/opt/keycloak/themes/gabarit:ro

  web:
    build:
      target: dev
    image: gabarit/web:dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      # node_modules fica o da imagem (instalado no Linux do container), não o do host.
      # Mudou o package.json? Recrie com: docker compose up -d --build --renew-anon-volumes web
      - /app/node_modules
    restart: "no"

  core:
    build:
      target: dev
    image: gabarit/core:dev
    ports:
      - "${CORE_PORT:-8080}:8080"
    volumes:
      # só fonte e pom (somente leitura); target/ fica dentro do container, sem arquivo de root no host
      - ./services/core/src:/app/src:ro
      - ./services/core/pom.xml:/app/pom.xml:ro
      # schemas compartilhados, usados nos testes de contrato
      - ./contracts:/contracts:ro
      # topologia real do RabbitMQ, importada no Testcontainers
      - ./infra/rabbitmq/definitions.json:/infra/rabbitmq/definitions.json:ro
      # cache do Maven: não baixa tudo de novo a cada container
      - core_m2:/root/.m2
    restart: "no"

  scraper:
    build:
      target: dev
    image: gabarit/scraper:dev
    volumes:
      - ./services/scraper:/app
      # schemas compartilhados, usados nos testes de contrato
      - ./contracts:/contracts:ro
    restart: "no"

volumes:
  core_m2:
