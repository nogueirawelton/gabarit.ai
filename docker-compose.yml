services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: gabarit_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # lido pelos scripts em infra/postgres/init (só no primeiro boot, com volume vazio)
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?defina CORE_DB_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: gabarit_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?defina RABBITMQ_USER no .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # one-shot: garante exchanges e filas dos consumidores antes de qualquer publisher subir,
  # senão evento publicado sem fila ligada é descartado pelo broker
  rabbitmq-init:
    image: rabbitmq:3.13.7-management
    container_name: gabarit_rabbitmq_init
    entrypoint: ["/init.sh"]
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    volumes:
      - ./infra/rabbitmq/init.sh:/init.sh:ro
      - ./infra/rabbitmq/definitions.json:/definitions.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

  scraper:
    build:
      context: ./services/scraper
      target: prod
    image: gabarit/scraper
    container_name: gabarit_scraper
    shm_size: 1gb
    env_file:
      - path: .env
        required: false
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # cron que só publica comandos (infra/scheduler/crontab); disparo manual: make scrape
  scheduler:
    build:
      context: ./infra/scheduler
    image: gabarit/scheduler
    container_name: gabarit_scheduler
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
