# Config de ferramentas (pytest, ruff). As dependências continuam nos requirements*.txt
[project]
name = "extraction"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # bugbear
  "SIM",   # simplificações
  "ASYNC", # chamada bloqueante dentro de código async
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
