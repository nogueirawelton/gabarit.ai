# Tema de login do gabarit.ai. Herda do "base" (só marcação, sem estilo) e usa template.ftl e CSS próprios.
parent=base
import=common/keycloak
styles=css/styles.css
locales=pt-BR

# Classes que as páginas do Keycloak aplicam nos elementos (mapeadas para o CSS do tema)
kcFormClass=gb-form
kcFormGroupClass=gb-field
kcFormSettingClass=gb-settings
kcFormOptionsWrapperClass=gb-options-link
kcFormButtonsClass=gb-actions
kcContentWrapperClass=gb-row
kcLabelWrapperClass=
kcInputWrapperClass=
kcLabelClass=gb-label
kcInputClass=gb-input
kcInputGroup=gb-input-group
kcInputErrorMessageClass=gb-error
kcInputHelperTextBeforeClass=gb-help
kcInputHelperTextAfterClass=gb-help
kcCheckboxInputClass=gb-checkbox
kcInputClassCheckbox=gb-check
kcInputClassCheckboxInput=gb-checkbox
kcInputClassCheckboxLabel=gb-check-label
kcInputClassRadio=gb-check
kcInputClassRadioInput=gb-checkbox
kcInputClassRadioLabel=gb-check-label

kcButtonClass=gb-btn
kcButtonPrimaryClass=gb-btn--primary
kcButtonDefaultClass=gb-btn--secondary
kcButtonBlockClass=gb-btn--block
kcButtonLargeClass=

kcFormPasswordVisibilityButtonClass=gb-eye
kcFormPasswordVisibilityIconShow=gb-icon gb-icon--eye
kcFormPasswordVisibilityIconHide=gb-icon gb-icon--eye-off

kcFormSocialAccountSectionClass=gb-social
kcFormSocialAccountListClass=gb-social-list
kcFormSocialAccountListGridClass=gb-social-list--grid
kcFormSocialAccountListButtonClass=gb-btn gb-btn--secondary gb-btn--block
kcFormSocialAccountListButtonDisabledClass=gb-btn--disabled
kcFormSocialAccountGridItem=
kcFormSocialAccountNameClass=
kcCommonLogoIdP=gb-idp-icon

kcResetFlowIcon=gb-icon gb-icon--restart
