# Produção (Coolify, build pack "Docker Compose", arquivo: docker-compose.prod.yml).
#
# - Sem portas publicadas: o proxy do Coolify chega nos serviços pela rede do recurso.
#   Domínios (aba de cada serviço no Coolify, com a porta interna no fim):
#     web      https://app.<domínio>:8080
#     keycloak https://auth.<domínio>:8080
#     core     https://api.<domínio>:8080
#     minio    https://files.<domínio>:9000   (só a API S3, para as URLs pré-assinadas; console fica fechado)
#   Os outros serviços são internos (sem domínio).
# - Sem container_name: o Coolify prefixa os nomes.
# - Rede: a da Destination do Coolify (personal_gabarit-ai_network), que já existe no servidor
#   (external). Todos os serviços entram nela e se acham pelo nome (postgres, rabbitmq, keycloak...).
# - Sem bind mount: tudo que vem do repositório está dentro das imagens.
# - Limite de memória em todo serviço (deploy.resources.limits): as JVMs (core, keycloak) e o
#   RabbitMQ dimensionam heap/alarme por ele; sem limite, calculariam sobre a RAM do servidor.
#   Soma dos limites: ~5 GB.
# - Variáveis: as do .env.example, cadastradas na aba Environment Variables do recurso.
#   WEB_URL e SMTP_* são lidos pelo realm só no primeiro deploy (banco vazio).
services:
  postgres:
    build:
      context: ./infra/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # lido pelos scripts de init da imagem (só no primeiro boot, com volume vazio)
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?defina CORE_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # shared_buffers padrão (128 MB) + conexões; suba junto com o volume de dados/embeddings
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13.7-management
    # tudo como rabbitmq (inclusive o healthcheck): rodando como root, o healthcheck cria o
    # .erlang.cookie antes do servidor e ele não sobe mais (eacces) num volume novo
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?defina RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD}
      # o RabbitMQ não enxerga o limite do container (calcula sobre a RAM do servidor): informa os
      # 512 MB do limite abaixo e bloqueia publishers a 60% (~320 MB; parado ele usa ~180 MB)
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
        -rabbit total_memory_available_override_value 536870912
        -rabbit vm_memory_high_watermark 0.6
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # one-shot: importa exchanges e filas antes de qualquer publisher subir. Termina depois disso:
  # exclude_from_hc (chave do Coolify) evita que o recurso apareça como "não saudável"
  rabbitmq-init:
    build:
      context: ./infra/rabbitmq
    exclude_from_hc: true
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    restart: "no"

  minio:
    build:
      context: ./infra/minio
      target: server
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
      # o navegador acessa o MinIO direto, por URL pré-assinada pelo core: só a origem do web
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_URL:?defina WEB_URL}
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /minio/health/live HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && read -r status <&3
          && [[ $$status == *' 200 '* ]]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384M
    restart: unless-stopped

  # one-shot: buckets, policies e usuário de cada serviço. Termina depois disso (exclude_from_hc)
  minio-init:
    build:
      context: ./infra/minio
      target: init
    exclude_from_hc: true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      CORE_MINIO_PASSWORD: ${CORE_MINIO_PASSWORD:?defina CORE_MINIO_PASSWORD}
      EXTRACTION_MINIO_PASSWORD: ${EXTRACTION_MINIO_PASSWORD:?defina EXTRACTION_MINIO_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    restart: "no"

  scraper:
    build:
      context: ./services/scraper
      target: prod
    shm_size: 1gb
    # DNS para fora da rede (o DNS interno do Docker continua resolvendo postgres, rabbitmq...).
    # Com os resolvedores do servidor, consultas externas falhavam de vez em quando
    # (UnknownHostException no SMTP / site do PCI)
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PCI_BASE_URL: ${PCI_BASE_URL:-https://www.pciconcursos.com.br}
      SCRAPER_REQUEST_DELAY_S: ${SCRAPER_REQUEST_DELAY_S:-1.0}
    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    # Chromium (Playwright); a /dev/shm usada também conta no limite
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  # worker da LLM (Claude): sai para a internet (API da Anthropic), daí o DNS próprio
  extraction:
    build:
      context: ./services/extraction
      target: prod
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: extraction
      MINIO_SECRET_KEY: ${EXTRACTION_MINIO_PASSWORD:?defina EXTRACTION_MINIO_PASSWORD}
      # a chave da Anthropic existe só neste serviço
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?defina ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    # um pedido por vez (prefetch 1), com os PDFs em memória (até 30 MB cada)
    deploy:
      resources:
        limits:
          memory: 384M
    restart: unless-stopped

  keycloak:
    build:
      context: ./infra/keycloak
    # DNS para fora da rede (o DNS interno do Docker continua resolvendo postgres, rabbitmq...).
    # Com os resolvedores do servidor, consultas externas falhavam de vez em quando
    # (UnknownHostException no SMTP / site do PCI)
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # comando padrão da imagem: start --optimized --import-realm
    environment:
      # heap = 50% do limite (o padrão do Keycloak, 70%, não deixa espaço para o resto da JVM em 1 GB)
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina KEYCLOAK_DB_PASSWORD}
      # admin do console, criado só no primeiro boot (banco vazio). Depois: crie um admin
      # permanente no realm master e apague este
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?defina KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD}
      # URL pública (issuer dos tokens), ex.: https://auth.<domínio>
      KC_HOSTNAME: ${KEYCLOAK_URL:?defina KEYCLOAK_URL}
      # TLS fica no proxy do Coolify, na frente
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # lidos pelo realm só no primeiro import; depois, mude pelo admin
      WEB_URL: ${WEB_URL:?defina WEB_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-no-reply@gabarit.ai}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # a imagem não tem curl/wget: HTTP na mão via /dev/tcp na porta de gerenciamento (9000)
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    # heap = 50% (JAVA_OPTS_KC_HEAP); ~600 MB depois do boot
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  core:
    build:
      context: ./services/core
      target: prod
    environment:
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      DB_HOST: postgres
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?defina CORE_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      # iss dos tokens = URL pública; chaves pela rede interna
      KEYCLOAK_URL: ${KEYCLOAK_URL:?defina KEYCLOAK_URL}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      # origem liberada no CORS
      WEB_URL: ${WEB_URL:?defina WEB_URL}
      # arquivos: upload/download pela rede interna; URLs pré-assinadas com a URL pública
      MINIO_URL: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?defina MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: core
      MINIO_SECRET_KEY: ${CORE_MINIO_PASSWORD:?defina CORE_MINIO_PASSWORD}
      # resumo diário de concursos por e-mail: mesmo SMTP do Keycloak. SMTP_HOST vazio = sem e-mail
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_FROM: ${SMTP_FROM:-no-reply@gabarit.ai}
      # trava de segurança: pedidos novos à LLM por pessoa em 24 h
      LLM_DAILY_LIMIT: ${LLM_DAILY_LIMIT:-150}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    # heap = 60% (Dockerfile); ~460 MB de heap
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  # cron que só publica comandos (infra/scheduler/crontab)
  scheduler:
    build:
      context: ./infra/scheduler
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  web:
    build:
      context: ./web
      target: prod
    # viram o config.js no boot (URLs públicas: quem usa é o navegador)
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:?defina KEYCLOAK_URL}
      API_URL: ${API_URL:?defina API_URL}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:

networks:
  default:
    name: personal_gabarit-ai_network
    external: true
