# Tudo que muda por ambiente vem de variável. Os defaults servem para rodar pela IDE, no host,
# contra o postgres/rabbitmq do compose (portas publicadas pelo docker-compose.yml de dev).
spring:
  application:
    name: core
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:core}
    username: ${DB_USER:core}
    password: ${CORE_DB_PASSWORD}

  jpa:
    # schema é das migrations (Flyway); o Hibernate só confere se as entidades batem
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # foto de perfil: o web já manda recortada e reduzida (~100 KB); o limite é para quem chama a API direto
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # resumo diário de concursos. SMTP_HOST vazio: o job não envia (só registra no log)
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      # 587 = STARTTLS; 465 = TLS direto (SMTP_SSL=true, SMTP_STARTTLS=false)
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  # erros da API no formato ProblemDetail (RFC 9457), inclusive validação do corpo
  mvc:
    problemdetails:
      enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}

  security:
    oauth2:
      resourceserver:
        jwt:
          # chaves de assinatura pela rede interna (de dentro do container, o Keycloak é keycloak:8080)
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:gabarit}/protocol/openid-connect/certs
          # o "iss" do token é a URL pública (a que o navegador usa); com jwk-set-uri definido,
          # o issuer só é conferido no token, sem o core precisar acessar essa URL
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:gabarit}
          # token emitido para o core (mapper "audience-core" no client web do realm)
          audiences: core

gabarit:
  # origem do web liberada no CORS
  web-url: ${WEB_URL:http://localhost:5173}
  notifications:
    from: ${SMTP_FROM:no-reply@gabarit.ai}
    # todo dia às 8h (horário de Brasília); formato cron do Spring (segundo minuto hora dia mês dia-da-semana)
    digest-cron: ${NOTIFICATION_DIGEST_CRON:0 0 8 * * *}
  # MinIO (API S3): bucket e usuário criados pela infra (infra/minio/init.sh)
  storage:
    # leitura e escrita (de dentro do container: http://minio:9000)
    url: ${MINIO_URL:http://localhost:9000}
    # host das URLs pré-assinadas, as que o navegador usa
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:core}
    secret-key: ${MINIO_SECRET_KEY}
    avatars-bucket: avatars
    documents-bucket: documents

management:
  health:
    # SMTP fora do ar não deixa o core "doente": o resumo tenta de novo no dia seguinte
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # /actuator/health/liveness e /readiness (usado no healthcheck do container)
      probes:
        enabled: true
